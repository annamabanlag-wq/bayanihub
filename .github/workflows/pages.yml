name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify BayaniHub release
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f campaign.html
          test -f submit.html
          test -f js/supabase.js
          test -f js/data.js
          test -f sw.js
          test -f assets/gcash-qr.svg
          ! grep -R --exclude-dir=.git --exclude=".github/workflows/pages.yml" -n "09381447214" .
          grep -q "gcash: null" submit.html
          grep -q "const CACHE = 'bayanihub-v56'" sw.js
          test "$(grep -l "ca-pub-9305686179934470" index.html campaign.html submit.html how.html privacy.html sponsor.html | wc -l)" -eq 6
          grep -Fxq "google.com, pub-9305686179934470, DIRECT, f08c47fec0942fa0" ads.txt
          grep -q '<link rel="canonical" href="https://bayanihub.vercel.app/">' index.html
          grep -q "Sitemap: https://bayanihub.vercel.app/sitemap.xml" robots.txt
          grep -q "https://bayanihub.vercel.app/" sitemap.xml
          grep -q "String(x?.path || '').trim()" admin.html
          ! grep -q "ca-pub-9305686179934470" login.html
          ! grep -q "ca-pub-9305686179934470" admin.html
      - name: Syntax-check browser JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for file in js/data.js js/app.js js/revenue.js js/payments.js js/supabase.js; do
            node --check "$file"
          done
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke-test published pages
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          for path in "" "campaign.html" "submit.html" "admin-v2.html" "login.html" "js/supabase.js" "sw.js" "robots.txt" "sitemap.xml"; do
            url="${PAGE_URL%/}/${path}"
            success=false
            for attempt in 1 2 3 4 5 6 7 8; do
              if curl --fail --silent --show-error "$url" --output /tmp/bayanihub-smoke; then
                success=true
                break
              fi
              sleep 5
            done
            if [ "$success" != true ] || [ ! -s /tmp/bayanihub-smoke ]; then
              echo "Smoke test failed for: $url"
              exit 1
            fi
            echo "PASS $url"
          done
