name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify BayaniHub release
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f campaign.html
          test -f submit.html
          test -f assets/gcash-qr.svg
          test -f js/supabase.js
          test -f js/data.js
          test -f sw.js
          ! grep -R --exclude-dir=.git --exclude=".github/workflows/pages.yml" -n "09381447214" .
          grep -q "assets/gcash-qr.svg" campaign.html
          grep -q "gcash: null" submit.html
          grep -q "const CACHE = 'bayanihub-v38'" sw.js
          test "$(grep -l "ca-pub-9305686179934470" index.html campaign.html submit.html how.html privacy.html sponsor.html | wc -l)" -eq 6
          grep -Fxq "google.com, pub-9305686179934470, DIRECT, f08c47fec0942fa0" ads.txt
          ! grep -q "ca-pub-9305686179934470" login.html
          ! grep -q "ca-pub-9305686179934470" admin.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
