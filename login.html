<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#0f172a">
  <meta name="robots" content="noindex,nofollow">
  <title>Staff login – BayaniHub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body{font-family:'Inter',system-ui,sans-serif}</style>
</head>
<body class="min-h-screen bg-slate-900 text-white flex items-center justify-center px-4">
  <div class="w-full max-w-sm">
    <p class="text-center text-xs tracking-[0.2em] uppercase text-teal-300 mb-2">BayaniHub staff</p>
    <h1 class="text-center text-2xl font-extrabold mb-6">Control login</h1>
    <form id="login-form" class="bg-slate-800 border border-slate-700 rounded-2xl p-5 space-y-3">
      <div>
        <label class="block text-xs text-slate-300 mb-1">Username</label>
        <input id="staff-user" autocomplete="username" required
               class="w-full px-3 py-2.5 rounded-xl bg-slate-900 border border-slate-600 text-sm outline-none focus:ring-2 focus:ring-teal-500">
      </div>
      <div>
        <label class="block text-xs text-slate-300 mb-1">Password</label>
        <input id="staff-pass" type="password" autocomplete="current-password" required
               class="w-full px-3 py-2.5 rounded-xl bg-slate-900 border border-slate-600 text-sm outline-none focus:ring-2 focus:ring-teal-500">
      </div>
      <p id="login-error" class="hidden text-xs text-red-400">Wrong username or password.</p>
      <button type="submit" class="w-full bg-teal-600 hover:bg-teal-500 font-bold py-3 rounded-xl">Sign in</button>
    </form>
    <p class="text-center text-[11px] text-slate-500 mt-4"><a href="index.html" class="underline">Back to public site</a></p>
  </div>
  <script src="js/data.js"></script>
  <script>
    if (Storage.isAdmin()) location.replace('admin.html');
    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const user = document.getElementById('staff-user').value.trim();
      const pass = document.getElementById('staff-pass').value;
      if (user === 'admin' && pass === 'bayaniadmin') {
        Storage.setAdmin(true);
        location.replace('admin.html');
      } else {
        document.getElementById('login-error').classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
