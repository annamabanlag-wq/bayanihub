<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d9488">
  <title>Payment status – BayaniHub</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50 text-gray-900 flex items-center justify-center px-4">
  <main class="w-full max-w-md bg-white border border-gray-100 rounded-2xl shadow-sm p-6 text-center">
    <div class="w-14 h-14 mx-auto rounded-full bg-brand-50 bg-teal-50 flex items-center justify-center text-2xl">💚</div>
    <h1 id="title" class="text-xl font-extrabold mt-4">Checking payment status…</h1>
    <p id="message" class="text-sm text-gray-600 mt-2">Please wait while BayaniHub checks the payment return information.</p>
    <a href="index.html" class="inline-block mt-5 bg-teal-600 text-white font-bold px-5 py-3 rounded-xl">Back to BayaniHub</a>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const status = String(params.get('status') || params.get('result') || '').toLowerCase();
    const title = document.getElementById('title');
    const message = document.getElementById('message');

    if (/success|paid|completed/.test(status)) {
      title.textContent = 'Payment received';
      message.textContent = 'BayaniHub received the payment return. Final campaign or advertising status is confirmed by the payment provider webhook.';
    } else if (/cancel|failed|error|declined/.test(status)) {
      title.textContent = 'Payment not completed';
      message.textContent = 'No support or advertising status is changed until the payment provider confirms the transaction.';
    } else {
      title.textContent = 'Payment submitted';
      message.textContent = 'Your payment provider return was received. BayaniHub will update the record after provider confirmation.';
    }
  </script>
</body>
</html>
